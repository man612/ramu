<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" fill="none">
<rect width="1200" height="930" rx="32" fill="#F7F3EA"/>
<g font-family="Inter,Segoe UI,sans-serif">
  <text x="64" y="70" font-size="18" font-weight="800" letter-spacing="3" fill="#6E726B">LIMA FONDASI RAMU</text>
  <text x="64" y="114" font-size="26" font-weight="600" fill="#252A25">Dibaca dari atas ke bawah: R · I · Z · M · A</text>
  <g transform="translate(54 148)"><rect width="1092" height="132" rx="24" fill="#F0DFD4"/><rect x="22" y="22" width="88" height="88" rx="20" fill="#B96A43"/><text x="66" y="84" text-anchor="middle" font-size="54" font-weight="900" fill="#FFF9F4">R</text><text x="142" y="58" font-size="30" font-weight="800" fill="#302824">Referensi</text><text x="142" y="92" font-size="20" fill="#665A53">Memilih sumber yang tepat sesuai pertanyaan dan masa berlakunya.</text></g>
  <g transform="translate(54 296)"><rect width="1092" height="132" rx="24" fill="#EEE3C7"/><rect x="22" y="22" width="88" height="88" rx="20" fill="#9B7A36"/><text x="66" y="84" text-anchor="middle" font-size="54" font-weight="900" fill="#FFFDF7">I</text><text x="142" y="58" font-size="30" font-weight="800" fill="#302B20">Instruksi</text><text x="142" y="92" font-size="20" fill="#655D4C">Mendahulukan aturan tugas, rubrik, tutor, dan ketentuan kampus.</text></g>
  <g transform="translate(54 444)"><rect width="1092" height="132" rx="24" fill="#DCE6DD"/><rect x="22" y="22" width="88" height="88" rx="20" fill="#496354"/><text x="66" y="84" text-anchor="middle" font-size="54" font-weight="900" fill="#F8FFF9">Z</text><text x="142" y="58" font-size="30" font-weight="800" fill="#263029">Zona Konteks</text><text x="142" y="92" font-size="20" fill="#526158">Menjaga satu mata kuliah tetap berada di Project-nya sendiri.</text></g>
  <g transform="translate(54 592)"><rect width="1092" height="132" rx="24" fill="#DBE6F1"/><rect x="22" y="22" width="88" height="88" rx="20" fill="#55759B"/><text x="66" y="84" text-anchor="middle" font-size="54" font-weight="900" fill="#F8FBFF">M</text><text x="142" y="58" font-size="30" font-weight="800" fill="#26303A">Materi</text><text x="142" y="92" font-size="20" fill="#55616D">BMP, bahan tutor, soal, dan materi kelas tetap menjadi dasar belajar.</text></g>
  <g transform="translate(54 740)"><rect width="1092" height="132" rx="24" fill="#E9DFE8"/><rect x="22" y="22" width="88" height="88" rx="20" fill="#765F77"/><text x="66" y="84" text-anchor="middle" font-size="54" font-weight="900" fill="#FFF9FF">A</text><text x="142" y="58" font-size="30" font-weight="800" fill="#322A33">Asesmen</text><text x="142" y="92" font-size="20" fill="#645665">Memeriksa isi, hitungan, sumber, dan format sebelum jawaban dianggap selesai.</text></g>
</g>
</svg>