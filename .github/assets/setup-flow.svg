<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" fill="none">
<rect width="1200" height="820" rx="32" fill="#F7F4ED"/>
<g font-family="Inter,Segoe UI,sans-serif">
<text x="64" y="70" font-size="18" font-weight="800" letter-spacing="3" fill="#6E726B">ALUR SETUP</text>
<text x="64" y="112" font-size="26" font-weight="600" fill="#252A25">Empat langkah. Setelah itu, GitHub tidak perlu dibuka setiap kali belajar.</text>
<g transform="translate(64 150)"><rect width="1072" height="128" rx="24" fill="#FFFFFF" stroke="#DCD4C5"/><circle cx="62" cy="64" r="34" fill="#203025"/><text x="62" y="76" text-anchor="middle" font-size="30" font-weight="900" fill="#FFFFFF">1</text><text x="122" y="54" font-size="28" font-weight="800" fill="#253128">Buka paket Semester 2</text><text x="122" y="88" font-size="20" fill="#657067">Semua file dan nama Project sudah disiapkan dalam satu halaman.</text></g>
<path d="M600 282v30" stroke="#A8B1A7" stroke-width="4" stroke-linecap="round"/><path d="M590 302l10 12 10-12" stroke="#A8B1A7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(64 320)"><rect width="1072" height="128" rx="24" fill="#FFFFFF" stroke="#DCD4C5"/><circle cx="62" cy="64" r="34" fill="#745B86"/><text x="62" y="76" text-anchor="middle" font-size="30" font-weight="900" fill="#FFFFFF">2</text><text x="122" y="54" font-size="28" font-weight="800" fill="#253128">Buat satu Project untuk setiap mata kuliah</text><text x="122" y="88" font-size="20" fill="#657067">Lima mata kuliah berarti lima Project agar file dan konteks tidak bercampur.</text></g>
<path d="M600 452v30" stroke="#A8B1A7" stroke-width="4" stroke-linecap="round"/><path d="M590 472l10 12 10-12" stroke="#A8B1A7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(64 490)"><rect width="1072" height="128" rx="24" fill="#FFFFFF" stroke="#DCD4C5"/><circle cx="62" cy="64" r="34" fill="#BB8C51"/><text x="62" y="76" text-anchor="middle" font-size="30" font-weight="900" fill="#FFFFFF">3</text><text x="122" y="54" font-size="28" font-weight="800" fill="#253128">Tempel instruksi dan unggah paket mata kuliah</text><text x="122" y="88" font-size="20" fill="#657067">Materi, soal, atau rubrik dapat ditambahkan kemudian saat memang diperlukan.</text></g>
<path d="M600 622v30" stroke="#A8B1A7" stroke-width="4" stroke-linecap="round"/><path d="M590 642l10 12 10-12" stroke="#A8B1A7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(64 660)"><rect width="1072" height="104" rx="24" fill="#203025"/><circle cx="62" cy="52" r="30" fill="#E4EFE2"/><text x="62" y="63" text-anchor="middle" font-size="27" font-weight="900" fill="#203025">4</text><text x="122" y="45" font-size="28" font-weight="800" fill="#F7F4ED">Pakai seperti biasa</text><text x="122" y="77" font-size="20" fill="#C6D0C5">Buka Project yang sesuai, kirim bahan, lalu jelaskan kebutuhanmu dengan bahasa biasa.</text></g>
</g>
