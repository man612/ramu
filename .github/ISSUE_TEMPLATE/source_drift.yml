name: Sumber berubah atau tidak dapat diakses
description: Laporkan source resmi yang berubah, pindah, kadaluarsa, atau berbeda dari data Ramu.
title: "[Source] "
labels: []
body:
  - type: input
    id: source
    attributes:
      label: Source ID atau nama sumber
      placeholder: contoh: ut-catalog-2026-2027
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Apa yang berubah?
      description: Jelaskan perbedaan yang ditemukan dan bagian Ramu yang mungkin terdampak.
    validations:
      required: true
  - type: input
    id: canonical
    attributes:
      label: Link sumber resmi terbaru
      description: Utamakan sumber institusi/penerbit resmi.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Bukti atau catatan verifikasi
      description: Tanggal pengecekan, halaman/bagian dokumen, atau alasan sumber lama dianggap tidak lagi kanonik.
