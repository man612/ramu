name: Validate Ramu

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "protocols/**"
      - "learning/**"
      - "sources/**"
      - "schemas/**"
      - "evals/**"
      - "scripts/**"
      - "packs/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/behavior-evals.yml"
      - ".github/workflows/manual-eval-kit.yml"

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packs.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate catalog, manifests, contracts, and registries
        run: python scripts/validate_repo.py

      - name: Check source review dates
        run: python scripts/check_source_freshness.py

      - name: Build pack matrix
        id: packs
        run: echo "matrix=$(python scripts/list_pack_ids.py --matrix)" >> "$GITHUB_OUTPUT"

  eval-wiring:
    needs: catalog
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate core + pack behavior wiring
        run: python scripts/run_behavior_evals.py --dry-run --pack "${{ matrix.pack }}"

  validate:
    name: validate
    if: always()
    needs: [catalog, eval-wiring]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce validation gate
        run: |
          test "${{ needs.catalog.result }}" = "success"
          test "${{ needs.eval-wiring.result }}" = "success"
          echo "All Ramu pack validations passed."
