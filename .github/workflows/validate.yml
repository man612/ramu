name: Validate Ramu

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packs.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate JSON Schema contracts
        run: python scripts/validate_schemas.py

      - name: Validate catalog, manifests, contracts, and registries
        run: python scripts/validate_repo.py

      - name: Validate cross-file scope identities
        run: python scripts/validate_scope_identities.py

      - name: Prove multi-pack and non-semester foundation
        run: python tests/test_multipack_foundation.py

      - name: Prove eval trust boundaries
        run: python tests/test_eval_trust_boundary.py

      - name: Prove critical eval gates
        run: python tests/test_eval_critical_gate.py

      - name: Prove manual Projects evidence contract
        run: python tests/test_manual_eval_evidence.py

      - name: Prove aggregate pilot evidence contract
        run: python tests/test_pilot_evidence.py

      - name: Validate published aggregate pilot evidence
        run: python scripts/pilot_evidence.py validate-published

      - name: Prove CI and Pages gate contract
        run: python tests/test_ci_contract.py

      - name: Validate human-facing project names
        run: python scripts/validate_display_names.py

      - name: Validate catalog-driven public site
        run: python scripts/validate_site.py

      - name: Check source review dates
        run: python scripts/check_source_freshness.py

      - name: Build pack matrix
        id: packs
        run: echo "matrix=$(python scripts/list_pack_ids.py --matrix)" >> "$GITHUB_OUTPUT"

  eval-wiring:
    needs: catalog
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate composable behavior wiring
        run: python scripts/run_behavior_evals.py --dry-run --pack "${{ matrix.pack }}"

  validate:
    name: validate
    if: always()
    needs: [catalog, eval-wiring]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce validation gate
        run: |
          test "${{ needs.catalog.result }}" = "success"
          test "${{ needs.eval-wiring.result }}" = "success"
          echo "All Ramu pack validations passed."
