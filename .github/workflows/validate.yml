name: Validate Ramu

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "protocols/**"
      - "learning/**"
      - "sources/**"
      - "schemas/**"
      - "evals/**"
      - "scripts/**"
      - "packs/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/behavior-evals.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository contracts
        run: python scripts/validate_repo.py

      - name: Validate behavior eval wiring
        run: python scripts/run_behavior_evals.py --dry-run

      - name: Check source review dates
        run: python scripts/check_source_freshness.py
