name: Source Freshness Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check freshness and URL reachability
        id: freshness
        continue-on-error: true
        run: python scripts/check_source_freshness.py --online --fail-on-network

      - name: Open review issue when source watch needs attention
        if: steps.freshness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh issue list --state open --search 'Source watch perlu ditinjau in:title' --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "Source watch perlu ditinjau" \
              --body "Pemeriksaan mingguan menemukan setidaknya satu sumber aktif melewati interval review atau watched source tidak dapat dijangkau. Buka log workflow ini, jalankan python scripts/check_source_freshness.py --online --fail-on-network, verifikasi sumber kanonik, lalu perbarui sources/registry.json bila diperlukan. Kegagalan reachability sendiri belum berarti fakta sumber berubah."
          fi

      - name: Fail job when source watch needs attention
        if: steps.freshness.outcome == 'failure'
        run: exit 1
