name: Source Freshness Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check freshness and URL reachability across registries
        id: freshness
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_source_freshness.py --online --fail-on-network 2>&1 | tee source-watch.log

      - name: Publish source-watch diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "### Source Freshness Watch"
            echo
            echo '```text'
            cat source-watch.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update review issue when source watch needs attention
        if: steps.freshness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing="$(gh issue list --state open --search 'Source watch perlu ditinjau in:title' --json number --jq '.[0].number // empty')"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "Pemeriksaan mingguan menemukan source aktif melewati interval review atau watched URL tetap tidak dapat dijangkau setelah retry."
            echo
            echo "Kegagalan reachability sendiri belum berarti fakta sumber berubah. Review output berikut, lalu periksa registry/source yang disebut."
            echo
            echo '```text'
            tail -n 80 source-watch.log
            echo '```'
            echo
            echo "Workflow run: $run_url"
          } > source-watch-issue.md

          if [ -z "$existing" ]; then
            gh issue create \
              --title "Source watch perlu ditinjau" \
              --body-file source-watch-issue.md
          else
            gh issue comment "$existing" --body-file source-watch-issue.md
          fi

      - name: Fail job when source watch needs attention
        if: steps.freshness.outcome == 'failure'
        run: exit 1
