name: Source Freshness Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check freshness and URL reachability across registries
        id: freshness
        continue-on-error: true
        run: python scripts/check_source_freshness.py --online --fail-on-network

      - name: Open review issue when source watch needs attention
        if: steps.freshness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh issue list --state open --search 'Source watch perlu ditinjau in:title' --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "Source watch perlu ditinjau" \
              --body "Pemeriksaan mingguan menemukan source aktif melewati interval review atau watched URL tidak dapat dijangkau. Buka log workflow, jalankan python scripts/check_source_freshness.py --online --fail-on-network, lalu periksa registry yang disebut pada output (global atau pack/institusi). Kegagalan reachability sendiri belum berarti fakta sumber berubah."
          fi

      - name: Fail job when source watch needs attention
        if: steps.freshness.outcome == 'failure'
        run: exit 1
